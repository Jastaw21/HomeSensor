<!DOCTYPE html>
<!--suppress HtmlFormInputWithoutLabel -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chestnut Home Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.0/plotly.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">

</head>
<body>

<div>
    <h1>Home Conditions</h1>
    <p class="subtitle" id="status">Loading...</p>
</div>

<!-- Filters -->
<div class="filter-row">
    <select id="sensor-filter">
        <option value="all">All sensors</option>
    </select>

    <select id="range-filter">
        <option value="6">Last 6 Hours</option>
        <option value="12">Last 12 Hours</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="48">Last 2 days</option>
        <option value="168">Last 7 days</option>
        <option value="0">All time</option>
    </select>

    <button onclick="runPage()">Refresh</button>
</div>

<!-- Current readings -->
<div class="textbox flex-textbox">
    <div>
        <h1 id="timestamp-value"></h1>
        <p>Time</p>
    </div>
    <div class="vertical"></div>
    <div>
        <h1 id="temp-value"></h1>
        <p>Temperature</p>
    </div>
    <div class="vertical"></div>

    <div>
        <h1 id="humidity-value"></h1>
        <p>Humidity</p>
    </div>

</div>

<!-- Charts -->

<div class="card">
    <h2>Temps</h2>
    <div id="temps-overview"></div>
</div>

<div class="card">
    <h2>Humidity</h2>
    <div id="humidity-overview"></div>
</div>



<div class="card">
    <h2>Daily Temp Range</h2>
    <div id="daily-graph"></div>
</div>

<div class="card">
    <h2>Daily Humidity Range</h2>
    <div id="daily-humidity-graph"></div>
</div>

<!-- Historical records -->
<div class="textbox flex-textbox-grid">

    <div id="record-high-container">
        <h1 class="high">High Temp</h1>
        <h1 id="record-high-value"></h1>
        <p id="record-ht-date" class="subtitle"></p>
    </div>

    <div id="record-low-container">
        <h1 class="low">Low Temp</h1>
        <h1 id="record-low-value"></h1>
        <p id="record-lt-date" class="subtitle"></p>
    </div>

    <div id="record-high-h-container">
        <h1 class="high">High Humidity</h1>
        <h1 id="record-high-h-value"></h1>
        <p id="record-hh-date" class="subtitle"></p>
    </div>

    <div id="record-low-h-container">
        <h1 class="low">Low Humidity</h1>
        <h1 id="record-low-h-value"></h1>
        <p id="record-lh-date" class="subtitle"></p>
    </div>

</div>


<script type="module" src="/static/plots.js"></script>

</body>
</html>
